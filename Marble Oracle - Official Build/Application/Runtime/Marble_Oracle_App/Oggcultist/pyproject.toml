[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oggcultist"
version = "2.0.6"
description = "Music player with a safe, non-destructive Opus library organiser and converter"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "mutagen>=1.47,<2",
    "Pillow>=10,<13",
    "jeepney>=0.8,<1; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=7,<10"]
build = ["pyinstaller>=6.3,<7"]

[project.scripts]
oggcultist = "oggcultist.startup:main"

[tool.setuptools.packages.find]
include = ["oggcultist*"]

[tool.setuptools.package-data]
oggcultist = ["resources/*", "resources/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
