name: tests

on:
  push:
    branches: ['claude/**']
  pull_request:
  workflow_dispatch:
    inputs:
      filters:
        description: 'Only run test scripts whose name contains one of these words (space separated)'
        required: false
        default: ''
      screens_in_log:
        description: 'Also print the screenshots into the job log as base64 JPEG (for review where artifacts cannot be downloaded)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-gui:
    name: Linux · Tk under Xvfb · FFmpeg
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk, Xvfb, FFmpeg and the Python libraries the suite uses
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk python3-pil python3-pil.imagetk python3-mutagen python3-numpy python3-opencv \
            xvfb xauth ffmpeg
      - name: Versions
        run: |
          python3 --version
          python3 -c "import tkinter; print('Tk', tkinter.Tcl().eval('info patchlevel'))"
          ffmpeg -hide_banner -version | head -1
      - name: Byte-compile every source file
        run: python3 -m compileall -q "Marble Oracle - Official Build/Application"
      - name: Regression tests
        run: |
          cd "Marble Oracle - Official Build"
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 Application/Tools/run_tests.py --tail 150 --json "$RUNNER_TEMP/test-results.json" ${{ inputs.filters }}
      - name: Screenshots of every workspace at the supported window sizes
        if: always()
        run: |
          cd "Marble Oracle - Official Build"
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 Application/Tools/capture_screens.py "$RUNNER_TEMP/screens" || true
      - name: Print screenshots into the log (manual runs only)
        if: ${{ always() && inputs.screens_in_log }}
        run: |
          python3 - "$RUNNER_TEMP/screens" <<'PY'
          import base64, io, sys
          from pathlib import Path
          from PIL import Image
          for path in sorted(Path(sys.argv[1]).glob('*.png')):
              image = Image.open(path).convert('RGB')
              buffer = io.BytesIO()
              image.save(buffer, 'JPEG', quality=62)
              print('SHOT', path.stem, base64.b64encode(buffer.getvalue()).decode())
          PY
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: ${{ runner.temp }}/test-results.json
          if-no-files-found: ignore
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-linux
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore

  time-travel:
    # Fixtures with fixed calendar dates pass today and fail next month.
    # Running the display-free tests with the clock moved forward finds them
    # before they bite. Informational: it never blocks a merge.
    name: Linux · clock +60 days (date-dependent fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk, Xvfb, FFmpeg, faketime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk python3-pil python3-pil.imagetk python3-mutagen python3-numpy python3-opencv \
            xvfb xauth ffmpeg faketime
      - name: AUGURSPEX tests, 60 days from now
        run: |
          cd "Marble Oracle - Official Build"
          xvfb-run -a -s "-screen 0 1920x1080x24" faketime -f '+60d' \
            python3 Application/Tools/run_tests.py --tail 40 augurspex market_atlas
